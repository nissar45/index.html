<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* Purple gradient background */
            background: linear-gradient(120deg, #4b45df, #8136e9);
        }

        .container {
            width: 500px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 28px;
            color: #222;
        }

        .row {
            display: flex;
            gap: 16px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #444;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            height: 42px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #5146df;
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 5px 0 18px;
            font-size: 14px;
            color: #444;
        }

        .terms input {
            width: 14px;
            height: 14px;
        }

        .terms label {
            margin: 0;
            font-size: 14px;
        }

        button {
            width: 100%;
            height: 43px;
            border: none;
            border-radius: 7px;
            background: #5046df;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4036d0;
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            .container {
                width: 90%;
                padding: 25px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Create Account</h1>

        <form>

            <div class="row">

                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" placeholder="John">
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" placeholder="Doe">
                </div>

            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="">
            </div>

            <div class="row">

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="••••••••">
                </div>

            </div>

            <div class="terms">
                <input type="checkbox" id="agree">
                <label for="agree">I agree to the Terms & Conditions</label>
            </div>

            <button type="submit">Sign Up</button>

        </form>

    </div>

</body>
</html>
